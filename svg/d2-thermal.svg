<svg viewBox="0 0 760 250" width="100%" role="img" aria-labelledby="d2t d2d" xmlns="http://www.w3.org/2000/svg">
  <title id="d2t">The competitor: a warmer day moves the buildings and the air in opposite directions</title>
  <desc id="d2d">Two lanes. Top: warmer air has lower refractivity, so the delay to a high point shrinks by about 0.12 mm per kelvin per 100 m. Bottom: the building expands by about 1 mm per kelvin per 100 m, with a lag of a few days. Both depend on height and on temperature, so they must be fitted together.</desc>
  <defs><marker id="d2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
  <!-- the driver -->
  <rect x="20" y="95" width="120" height="60" rx="6" class="svg-box"/>
  <text x="80" y="118" class="svg-text" text-anchor="middle" font-weight="600">a warmer day</text>
  <text x="80" y="136" class="svg-small" text-anchor="middle">+1 K air temperature</text>
  <!-- top lane: air -->
  <path d="M140 115 h20 v-70 h30" class="svg-arrow-accent" marker-end="url(#d2a)"/>
  <rect x="190" y="20" width="160" height="50" rx="6" class="svg-box-fill"/>
  <text x="270" y="40" class="svg-text" text-anchor="middle" font-weight="600">the air thins out</text>
  <text x="270" y="57" class="svg-small" text-anchor="middle">N drops by about 1 N-unit per K</text>
  <line x1="350" y1="45" x2="380" y2="45" class="svg-arrow-accent" marker-end="url(#d2a)"/>
  <rect x="380" y="20" width="200" height="50" rx="6" class="svg-box-fill"/>
  <text x="480" y="40" class="svg-text" text-anchor="middle" font-weight="600">less delay to the high point</text>
  <text x="480" y="57" class="svg-small" text-anchor="middle">about −0.12 mm per K per 100 m of height</text>
  <!-- bottom lane: building -->
  <path d="M140 135 h20 v70 h30" class="svg-arrow-warn" marker-end="url(#d2a)"/>
  <rect x="190" y="180" width="160" height="50" rx="6" class="svg-box-warn"/>
  <text x="270" y="200" class="svg-text" text-anchor="middle" font-weight="600">the building warms up</text>
  <text x="270" y="217" class="svg-small" text-anchor="middle">lagging the air by about 5 days</text>
  <line x1="350" y1="205" x2="380" y2="205" class="svg-arrow-warn" marker-end="url(#d2a)"/>
  <rect x="380" y="180" width="200" height="50" rx="6" class="svg-box-warn"/>
  <text x="480" y="200" class="svg-text" text-anchor="middle" font-weight="600">and grows taller</text>
  <text x="480" y="217" class="svg-small" text-anchor="middle">α ≈ 10⁻⁵ per K: +1 mm per K per 100 m</text>
  <!-- join -->
  <path d="M580 45 h20 v70 h20" class="svg-arrow" marker-end="url(#d2a)"/>
  <path d="M580 205 h20 v-70 h20" class="svg-arrow" marker-end="url(#d2a)"/>
  <rect x="620" y="85" width="130" height="80" rx="6" class="svg-box"/>
  <text x="685" y="105" class="svg-text" text-anchor="middle" font-weight="600">same driver,</text>
  <text x="685" y="121" class="svg-text" text-anchor="middle" font-weight="600">same height dependence,</text>
  <text x="685" y="137" class="svg-text" text-anchor="middle" font-weight="600">opposite sign</text>
  <text x="685" y="155" class="svg-small" text-anchor="middle">the building term is 8× larger</text>
  <!-- footnote -->
  <text x="380" y="245" class="svg-small" text-anchor="middle">so the two are fitted together, on 11-day changes: temperature 0.62 (physics 0.92) and refractivity 0.064 (physics 0.109) mm per 100 m, barely tangled (VIF 1.12)</text>
</svg>
