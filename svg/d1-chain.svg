<svg viewBox="0 0 760 340" width="100%" role="img" aria-labelledby="d1t d1d" xmlns="http://www.w3.org/2000/svg">
  <title id="d1t">From the weather to the radar phase and back: the chain of the method</title>
  <desc id="d1d">Ten boxes in three rows. Forward: pressure, temperature and humidity at each height give the vapour pressure, then the refractivity N, then the delay along the ray, referenced to the reference point, then the phase, then the line-of-sight projection. Retrieval: the double difference between two points and two passes, the removal of building motion, the triangular inversion, and the refractivity per layer.</desc>
  <defs><marker id="d1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
  <!-- brackets -->
  <path d="M30 26 v-6 h700 v6" class="svg-arrow"/>
  <text x="380" y="14" class="svg-small" text-anchor="middle">forward model: what a known atmosphere does to the radar (the end-to-end simulation, section 3.1 of the paper)</text>
  <path d="M30 326 v6 h700 v-6" class="svg-arrow"/>
  <text x="380" y="326" class="svg-small" text-anchor="middle">retrieval: from radar phases back to the air (sections 3.2 to 3.4)</text>
  <!-- row 1 -->
  <rect x="30" y="40" width="130" height="62" rx="6" class="svg-box"/>
  <text x="95" y="60" class="svg-text" text-anchor="middle" font-weight="600">P, T, RH at height z</text>
  <text x="95" y="78" class="svg-small" text-anchor="middle">what a balloon measures</text>
  <text x="95" y="92" class="svg-small" text-anchor="middle">(De Bilt, once a day)</text>
  <line x1="160" y1="71" x2="176" y2="71" class="svg-arrow" marker-end="url(#d1a)"/>
  <rect x="176" y="40" width="118" height="62" rx="6" class="svg-box"/>
  <text x="235" y="60" class="svg-text" text-anchor="middle" font-weight="600">vapour pressure e</text>
  <text x="235" y="78" class="svg-small" text-anchor="middle">e = RH/100 · e_s(T)</text>
  <text x="235" y="92" class="svg-small" text-anchor="middle">Magnus formula</text>
  <line x1="294" y1="71" x2="310" y2="71" class="svg-arrow" marker-end="url(#d1a)"/>
  <rect x="310" y="40" width="230" height="62" rx="6" class="svg-box-fill"/>
  <text x="425" y="58" class="svg-text" text-anchor="middle" font-weight="600">refractivity N</text>
  <text x="425" y="76" class="svg-eq" text-anchor="middle" font-size="11">N = 77.6 p_d/T + 72 e/T + 3.75·10⁵ e/T²</text>
  <text x="425" y="92" class="svg-small" text-anchor="middle" font-size="10">one number for the air, about 300 near the ground</text>
  <line x1="540" y1="71" x2="556" y2="71" class="svg-arrow" marker-end="url(#d1a)"/>
  <rect x="556" y="40" width="174" height="62" rx="6" class="svg-box"/>
  <text x="643" y="58" class="svg-text" text-anchor="middle" font-weight="600">delay along the ray</text>
  <text x="643" y="76" class="svg-eq" text-anchor="middle">d(z) = 10⁻⁶ ∫ N ds</text>
  <text x="643" y="92" class="svg-small" text-anchor="middle">31 mm per 100 m of air</text>
  <!-- connector down -->
  <path d="M643 102 v18 h-548 v18" class="svg-arrow" marker-end="url(#d1a)"/>
  <!-- row 2 -->
  <rect x="30" y="140" width="176" height="62" rx="6" class="svg-box"/>
  <text x="118" y="158" class="svg-text" text-anchor="middle" font-weight="600">a zero: the reference point</text>
  <text x="118" y="176" class="svg-small" text-anchor="middle">d(RP) = 0 on every pass;</text>
  <text x="118" y="190" class="svg-small" text-anchor="middle" font-size="10">where and how high we do not know</text>
  <line x1="206" y1="171" x2="222" y2="171" class="svg-arrow" marker-end="url(#d1a)"/>
  <rect x="222" y="140" width="140" height="62" rx="6" class="svg-box"/>
  <text x="292" y="158" class="svg-text" text-anchor="middle" font-weight="600">phase</text>
  <text x="292" y="176" class="svg-eq" text-anchor="middle">ψ = 4π d / λ</text>
  <text x="292" y="190" class="svg-small" text-anchor="middle">λ = 3.1 cm: a cycle per 1.55 cm</text>
  <line x1="362" y1="171" x2="378" y2="171" class="svg-arrow" marker-end="url(#d1a)"/>
  <rect x="378" y="140" width="150" height="62" rx="6" class="svg-box"/>
  <text x="453" y="158" class="svg-text" text-anchor="middle" font-weight="600">line of sight</text>
  <text x="453" y="176" class="svg-eq" text-anchor="middle">slant = zenith / cos 23°</text>
  <text x="453" y="190" class="svg-small" text-anchor="middle">what the satellite measures</text>
  <line x1="528" y1="171" x2="544" y2="171" class="svg-arrow" marker-end="url(#d1a)"/>
  <rect x="544" y="140" width="186" height="62" rx="6" class="svg-box-warn"/>
  <text x="637" y="158" class="svg-text" text-anchor="middle" font-weight="600">double difference</text>
  <text x="637" y="176" class="svg-small" text-anchor="middle" font-size="10">A minus B, this pass minus the first;</text>
  <text x="637" y="190" class="svg-small" text-anchor="middle">plus building motion, plus noise</text>
  <!-- connector down -->
  <path d="M637 202 v18 h-517 v18" class="svg-arrow" marker-end="url(#d1a)"/>
  <!-- row 3 -->
  <rect x="30" y="240" width="220" height="62" rx="6" class="svg-box"/>
  <text x="140" y="258" class="svg-text" text-anchor="middle" font-weight="600">remove the building motion</text>
  <text x="140" y="276" class="svg-small" text-anchor="middle">trend, yearly wave, curvature per point;</text>
  <text x="140" y="290" class="svg-small" text-anchor="middle">what is left changes from pass to pass</text>
  <line x1="250" y1="271" x2="266" y2="271" class="svg-arrow" marker-end="url(#d1a)"/>
  <rect x="266" y="240" width="250" height="62" rx="6" class="svg-box"/>
  <text x="391" y="258" class="svg-text" text-anchor="middle" font-weight="600">the height-difference inversion</text>
  <text x="391" y="276" class="svg-eq" text-anchor="middle">Δd = 10⁻⁶ · L · N / cos 23°</text>
  <text x="391" y="290" class="svg-small" text-anchor="middle">L: the layer thicknesses, lower triangular</text>
  <line x1="516" y1="271" x2="532" y2="271" class="svg-arrow" marker-end="url(#d1a)"/>
  <rect x="532" y="240" width="198" height="62" rx="6" class="svg-box-good"/>
  <text x="631" y="258" class="svg-text" text-anchor="middle" font-weight="600">N per layer, per pass</text>
  <text x="631" y="276" class="svg-small" text-anchor="middle">today: one layer mean, 0 to 83 m;</text>
  <text x="631" y="290" class="svg-small" text-anchor="middle">1.69 mm/100 m ≈ 16 N-units of change</text>
</svg>
