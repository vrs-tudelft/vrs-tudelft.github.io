<svg viewBox="0 0 760 400" width="100%" role="img" aria-labelledby="d7t d7d" xmlns="http://www.w3.org/2000/svg">
  <title id="d7t">Two radar points at different heights, and the layer of air between them</title>
  <desc id="d7d">A tall building with radar point A at about 50 m and a low building with point B near 5 m. The satellite, to the upper right, sends two parallel rays. The layer of air between the two heights is shaded: the difference of the two delays measures that layer, plus whatever the buildings did.</desc>
  <defs><marker id="d7arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
  <!-- ground -->
  <rect x="40" y="300" width="560" height="14" class="svg-ground"/>
  <text x="44" y="330" class="svg-small">quay, about 3 m above sea level (NAP)</text>
  <!-- the layer -->
  <rect x="40" y="120" width="560" height="160" class="svg-layer"/>
  <text x="330" y="150" class="svg-text" text-anchor="middle" font-weight="600">the layer of air we measure</text>
  <text x="330" y="168" class="svg-small" text-anchor="middle">between the heights of A and B: about 45 m here, at most 83 m in this data set</text>
  <!-- tall building -->
  <rect x="120" y="60" width="90" height="240" class="svg-building"/>
  <line x1="120" y1="100" x2="210" y2="100" class="svg-line"/><line x1="120" y1="140" x2="210" y2="140" class="svg-line"/>
  <line x1="120" y1="180" x2="210" y2="180" class="svg-line"/><line x1="120" y1="220" x2="210" y2="220" class="svg-line"/><line x1="120" y1="260" x2="210" y2="260" class="svg-line"/>
  <circle cx="210" cy="120" r="5" class="svg-dot"/>
  <text x="222" y="116" class="svg-text" font-weight="600">A</text>
  <text x="222" y="131" class="svg-small">radar point, 50 m up</text>
  <!-- low building -->
  <rect x="380" y="240" width="110" height="60" class="svg-building"/>
  <circle cx="490" cy="280" r="5" class="svg-dot"/>
  <text x="500" y="276" class="svg-text" font-weight="600">B</text>
  <text x="500" y="291" class="svg-small">radar point, 5 m up</text>
  <!-- satellite -->
  <g transform="translate(660,40)">
    <rect x="-14" y="-8" width="28" height="16" class="svg-box" rx="2"/>
    <rect x="-46" y="-4" width="28" height="8" class="svg-box-fill"/><rect x="18" y="-4" width="28" height="8" class="svg-box-fill"/>
  </g>
  <text x="660" y="72" class="svg-small" text-anchor="middle">TerraSAR-X, from the east-south-east,</text>
  <text x="660" y="86" class="svg-small" text-anchor="middle">every 11 days, 23° from vertical</text>
  <!-- rays: parallel, slope ~ tan(23 deg) horizontal per vertical... drawn steeper for clarity -->
  <line x1="640" y1="56" x2="214" y2="118" class="svg-ray" marker-end="url(#d7arr)"/>
  <line x1="676" y1="104" x2="494" y2="278" class="svg-ray" marker-end="url(#d7arr)"/>
  <!-- extra path highlight on ray B inside the layer -->
  <line x1="640" y1="140" x2="494" y2="278" stroke="var(--accent)" stroke-width="4" opacity=".55"/>
  <text x="600" y="215" class="svg-small" text-anchor="start">the extra path of ray B</text>
  <text x="600" y="229" class="svg-small" text-anchor="start">through the layer</text>
  <!-- formula -->
  <rect x="40" y="348" width="680" height="40" rx="6" class="svg-box"/>
  <text x="380" y="366" class="svg-eq" text-anchor="middle">delay(B) − delay(A)  =  the shaded air  +  what the buildings did (sinking, expanding, shrinking)</text>
  <text x="380" y="382" class="svg-small" text-anchor="middle">everything above both points, and everything common to the whole scene, cancels in the difference</text>
</svg>
