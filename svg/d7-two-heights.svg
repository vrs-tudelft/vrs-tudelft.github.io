<svg viewBox="0 0 760 420" width="100%" role="img" aria-labelledby="d7t d7d" xmlns="http://www.w3.org/2000/svg">
  <title id="d7t">Two radar points at different heights, and the layer of air between them</title>
  <desc id="d7d">A tall building carries radar point A about 50 m up; a low building carries point B near the street. The satellite, to the upper right, sends parallel rays to both. The ray to the low point crosses extra air between the two heights, and that layer is shaded. The difference of the two delays measures that layer, plus whatever the buildings did.</desc>
  <defs><marker id="d7arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>

  <!-- the heights of A and B -->
  <line x1="60" y1="150" x2="648" y2="150" class="svg-line" stroke-dasharray="4 4"/>
  <line x1="60" y1="300" x2="648" y2="300" class="svg-line" stroke-dasharray="4 4"/>
  <rect x="176" y="150" width="248" height="150" class="svg-layer"/>

  <!-- the extra path of the lower ray, inside the layer -->
  <line x1="604" y1="150" x2="520" y2="300" stroke="var(--accent)" stroke-width="5" opacity=".45"/>

  <!-- buildings and ground -->
  <rect x="90" y="100" width="80" height="230" class="svg-building"/>
  <line x1="90" y1="140" x2="170" y2="140" class="svg-line"/><line x1="90" y1="180" x2="170" y2="180" class="svg-line"/>
  <line x1="90" y1="220" x2="170" y2="220" class="svg-line"/><line x1="90" y1="260" x2="170" y2="260" class="svg-line"/>
  <rect x="430" y="280" width="90" height="50" class="svg-building"/>
  <rect x="30" y="330" width="610" height="12" class="svg-ground"/>
  <text x="34" y="360" class="svg-small">quay, about 3 m above sea level</text>

  <!-- satellite -->
  <g transform="translate(660,50)">
    <rect x="-14" y="-8" width="28" height="16" class="svg-box"/>
    <rect x="-46" y="-4" width="28" height="8" class="svg-box-fill"/><rect x="18" y="-4" width="28" height="8" class="svg-box-fill"/>
  </g>
  <text x="744" y="84" class="svg-small" text-anchor="end">TerraSAR-X, every 11 days,</text>
  <text x="744" y="98" class="svg-small" text-anchor="end">from the east, 23° from vertical</text>

  <!-- the two rays, parallel -->
  <line x1="254" y1="4" x2="173" y2="148" class="svg-ray" marker-end="url(#d7arr)"/>
  <line x1="646" y1="60" x2="523" y2="297" class="svg-ray" marker-end="url(#d7arr)"/>

  <!-- the two points -->
  <circle cx="170" cy="150" r="5" class="svg-dot"/>
  <text x="178" y="141" class="svg-text" font-weight="600">A</text>
  <text x="192" y="141" class="svg-small">radar point, 50 m up</text>
  <circle cx="520" cy="300" r="5" class="svg-dot"/>
  <text x="530" y="321" class="svg-text" font-weight="600">B</text>
  <text x="544" y="321" class="svg-small">radar point, 5 m up</text>

  <!-- labels inside the layer -->
  <text x="300" y="206" class="svg-text" text-anchor="middle" font-weight="600">the layer of air we measure</text>
  <text x="300" y="226" class="svg-small" text-anchor="middle">45 m apart here;</text>
  <text x="300" y="240" class="svg-small" text-anchor="middle">at most 83 m in this data set</text>
  <text x="612" y="202" class="svg-small">the extra air</text>
  <text x="612" y="216" class="svg-small">ray B crosses</text>

  <!-- the sum -->
  <text x="380" y="390" class="svg-eq" text-anchor="middle">delay(B) − delay(A)  =  the air in the shaded layer  +  what the buildings did</text>
  <text x="380" y="408" class="svg-small" text-anchor="middle">everything above both points, and everything common to the whole scene, cancels in the difference</text>
</svg>
