<svg viewBox="0 0 760 330" width="100%" role="img" aria-labelledby="d4t d4d" xmlns="http://www.w3.org/2000/svg">
  <title id="d4t">The height-difference inversion: delay differences in, a refractivity per layer out</title>
  <desc id="d4d">A six-by-six lower-triangular matrix of layer thicknesses. Each row is the delay difference between a height level and the reference level; each column is the refractivity of one layer. The lowest row involves one layer, the highest row all six, so the system is solved from the bottom up.</desc>
  <defs><marker id="d4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
  <!-- left vector -->
  <g transform="translate(20,40)">
    <text x="70" y="-14" class="svg-small" text-anchor="middle">delay differences, measured</text>
    <path d="M8 0 h-6 v216 h6" class="svg-arrow"/><path d="M132 0 h6 v216 h-6" class="svg-arrow"/>
    <text x="70" y="26" class="svg-eq" text-anchor="middle">d(z₆) − d(RP)</text>
    <text x="70" y="62" class="svg-eq" text-anchor="middle">d(z₅) − d(RP)</text>
    <text x="70" y="98" class="svg-eq" text-anchor="middle">d(z₄) − d(RP)</text>
    <text x="70" y="134" class="svg-eq" text-anchor="middle">d(z₃) − d(RP)</text>
    <text x="70" y="170" class="svg-eq" text-anchor="middle">d(z₂) − d(RP)</text>
    <text x="70" y="206" class="svg-eq" text-anchor="middle">d(z₁) − d(RP)</text>
  </g>
  <text x="180" y="150" class="svg-eq" text-anchor="middle" font-size="18">=</text>
  <text x="180" y="172" class="svg-small" text-anchor="middle">10⁻⁶ / cos 23°</text>
  <!-- matrix -->
  <g transform="translate(210,40)">
    <text x="108" y="-14" class="svg-small" text-anchor="middle">L: which layers each ray crosses (thickness Δz)</text>
    <path d="M8 0 h-6 v216 h6" class="svg-arrow"/><path d="M208 0 h6 v216 h-6" class="svg-arrow"/>
    <!-- rows top = z6 ... bottom = z1; columns layers 1..6 left to right -->
    <!-- row z6: all six -->
    <rect x="12" y="4" width="30" height="30" class="svg-box-fill"/><rect x="44" y="4" width="30" height="30" class="svg-box-fill"/><rect x="76" y="4" width="30" height="30" class="svg-box-fill"/><rect x="108" y="4" width="30" height="30" class="svg-box-fill"/><rect x="140" y="4" width="30" height="30" class="svg-box-fill"/><rect x="172" y="4" width="30" height="30" class="svg-box-fill"/>
    <!-- row z5: five -->
    <rect x="12" y="40" width="30" height="30" class="svg-box-fill"/><rect x="44" y="40" width="30" height="30" class="svg-box-fill"/><rect x="76" y="40" width="30" height="30" class="svg-box-fill"/><rect x="108" y="40" width="30" height="30" class="svg-box-fill"/><rect x="140" y="40" width="30" height="30" class="svg-box-fill"/><rect x="172" y="40" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/>
    <!-- row z4 -->
    <rect x="12" y="76" width="30" height="30" class="svg-box-fill"/><rect x="44" y="76" width="30" height="30" class="svg-box-fill"/><rect x="76" y="76" width="30" height="30" class="svg-box-fill"/><rect x="108" y="76" width="30" height="30" class="svg-box-fill"/><rect x="140" y="76" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/><rect x="172" y="76" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/>
    <!-- row z3 -->
    <rect x="12" y="112" width="30" height="30" class="svg-box-fill"/><rect x="44" y="112" width="30" height="30" class="svg-box-fill"/><rect x="76" y="112" width="30" height="30" class="svg-box-fill"/><rect x="108" y="112" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/><rect x="140" y="112" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/><rect x="172" y="112" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/>
    <!-- row z2 -->
    <rect x="12" y="148" width="30" height="30" class="svg-box-fill"/><rect x="44" y="148" width="30" height="30" class="svg-box-fill"/><rect x="76" y="148" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/><rect x="108" y="148" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/><rect x="140" y="148" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/><rect x="172" y="148" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/>
    <!-- row z1 -->
    <rect x="12" y="184" width="30" height="30" class="svg-box-fill"/><rect x="44" y="184" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/><rect x="76" y="184" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/><rect x="108" y="184" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/><rect x="140" y="184" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/><rect x="172" y="184" width="30" height="30" class="svg-box" stroke-dasharray="3 3"/>
    <text x="27" y="230" class="svg-small" text-anchor="middle">layer 1</text><text x="187" y="230" class="svg-small" text-anchor="middle">layer 6</text>
    <text x="108" y="244" class="svg-small" text-anchor="middle">filled = Δz, dashed = 0</text>
  </g>
  <text x="450" y="150" class="svg-eq" text-anchor="middle" font-size="18">·</text>
  <!-- N vector -->
  <g transform="translate(470,40)">
    <text x="60" y="-14" class="svg-small" text-anchor="middle">refractivity per layer, wanted</text>
    <path d="M8 0 h-6 v216 h6" class="svg-arrow"/><path d="M112 0 h6 v216 h-6" class="svg-arrow"/>
    <text x="60" y="26" class="svg-eq" text-anchor="middle">N(layer 6)</text>
    <text x="60" y="62" class="svg-eq" text-anchor="middle">N(layer 5)</text>
    <text x="60" y="98" class="svg-eq" text-anchor="middle">N(layer 4)</text>
    <text x="60" y="134" class="svg-eq" text-anchor="middle">N(layer 3)</text>
    <text x="60" y="170" class="svg-eq" text-anchor="middle">N(layer 2)</text>
    <text x="60" y="206" class="svg-eq" text-anchor="middle">N(layer 1)</text>
  </g>
  <!-- notes -->
  <g transform="translate(610,40)">
    <rect x="0" y="0" width="140" height="96" rx="6" class="svg-box"/>
    <text x="70" y="20" class="svg-text" text-anchor="middle" font-weight="600">solve from the bottom up</text>
    <text x="70" y="38" class="svg-small" text-anchor="middle">the lowest row has one unknown;</text>
    <text x="70" y="52" class="svg-small" text-anchor="middle">each row above adds one layer</text>
    <text x="70" y="70" class="svg-small" text-anchor="middle">a difference between passes</text>
    <text x="70" y="84" class="svg-small" text-anchor="middle">gives the change of N per layer</text>
    <rect x="0" y="112" width="140" height="104" rx="6" class="svg-box-warn"/>
    <text x="70" y="132" class="svg-text" text-anchor="middle" font-weight="600">where we are</text>
    <text x="70" y="150" class="svg-small" text-anchor="middle">with this data the profile is</text>
    <text x="70" y="164" class="svg-small" text-anchor="middle">a straight line (65 %) plus one</text>
    <text x="70" y="178" class="svg-small" text-anchor="middle">fixed kink at 20 to 30 m (78 %):</text>
    <text x="70" y="192" class="svg-small" text-anchor="middle">one layer mean per pass,</text>
    <text x="70" y="206" class="svg-small" text-anchor="middle">not six layers</text>
  </g>
  <text x="380" y="316" class="svg-small" text-anchor="middle">the absolute state of the first pass is recovered from the stack itself: T₀ = (Σ Tᵢ − Σ IFGᵢ) / m, where the sum of the true states averages to a known climatology</text>
</svg>
